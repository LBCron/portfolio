name: Visual baselines

# Regenerates the Linux screenshot baselines on the CI image (D61). Download
# the artifact and commit its PNGs under tests/e2e/__screenshots__/.
on:
  workflow_dispatch:

env:
  CONTENT_SOURCE: fixtures
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  ADMIN_PASSWORD: ci-only-password-not-a-secret
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test visual.spec.ts --project=chromium --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          retention-days: 7
